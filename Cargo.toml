[package]
name = "my-app-time"
version = "0.1.0-dev"
authors = ["Sergey Desyatkov <sergeydesyatkov@proton.me>"]
edition = "2024"
description = "Your app usage time tracker"
repository = "https://github.com/desyatkoff/my-app-time"
license = "GPL-3.0-or-later"

[dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
dirs = "7"
kdotool = "0.3"
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
